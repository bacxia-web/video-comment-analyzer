<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video &amp; Comment Analyzer</title><link rel="stylesheet" href="panel.css"></head>
<body>
  <header class="header"><div><strong>Video &amp; Comment Analyzer</strong><span class="subtitle">内容与评论分析</span></div><button id="settings" class="quiet">设置</button></header>
  <main>
    <section class="source" aria-label="当前页面"><span id="platform" class="badge">当前页面</span><h1 id="title">正在读取页面…</h1><p id="author" class="muted"></p></section>
    <nav class="modes" aria-label="分析内容"><button data-mode="video" aria-pressed="true">视频内容</button><button data-mode="comments" aria-pressed="false">评论内容</button></nav>
    <p id="hint" class="muted">打开支持的视频或笔记页面，然后点击开始分析。</p>
    <div class="actions"><button id="analyze" class="primary" disabled>开始分析</button><button id="collect" disabled>仅采集</button></div>
    <p class="muted fine">点击「开始分析」会将本次字幕或评论发送给 DeepSeek，按你的账户计费。</p>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="fixSettings" class="text-button" hidden>打开设置填写 Key</button>
    <section id="results" aria-label="分析结果" hidden></section>
    <div class="actions export-actions"><button id="exportReport" hidden>导出分析</button><button id="exportData" hidden>导出原始内容</button></div>
    <details id="raw" hidden><summary>查看采集内容 <span id="rawCount"></span></summary><div id="rawContent"></div></details>
    <footer><a id="legacy" href="sidepanel.html" hidden>打开 YouTube 学习工具</a><p class="muted fine">视频分析基于字幕，不识别画面。评论结论仅代表本次采集样本。</p></footer>
  </main>
  <script src="settings.js"></script><script src="platforms.js"></script><script src="setup.js"></script><script src="panel.js"></script>
</body></html>
